const INF_COLORS = {"手段": "#4a9ede", "治理对象": "#e74c3c", "目标": "#27ae60", "母题": "#f39c12", "原则": "#9b59b6", "结果": "#1abc9c", "制度来源": "#95a5a6"};

// ── 工具函数 ──────────────────────────────────────
// 汉字文本自动换行（最多两行，尽量对半分）
function wrapText(text, maxPerLine) {
  if (!text) return [''];
  if (text.length <= maxPerLine) return [text];
  const mid = Math.ceil(text.length / 2);
  return [text.slice(0, mid), text.slice(mid)];
}

// 根据标签文本估算概念节点半径（fs=11px，每汉字宽约11px）
function conceptRadius(label) {
  const lines = wrapText(label, 5);
  const maxLine = Math.max(...lines.map(l => l.length));
  return Math.max(28, maxLine * 6.5 + 14);
}

// ── 构建谓词节点（共享，按唯一谓词合并）───────────
function buildVerbNodes(conceptNodes) {
  const verbMap = {};
  conceptNodes.forEach(d => {
    if (d.verb) {
      if (!verbMap[d.verb]) verbMap[d.verb] = [];
      verbMap[d.verb].push(d);
    }
  });
  const verbNodes = Object.entries(verbMap).map(([verb, members]) => ({
    id: '__verb__' + verb,
    label: verb,
    type: 'verb',
    color: '#7ea8c0',
    r: 11,
    doc: '', basis: '', verb: verb, inf: '',
    _count: members.length,
    _members: members,
  }));
  const verbLinks = [];
  verbNodes.forEach(vn => {
    vn._members.forEach(c => {
      verbLinks.push({
        source: vn.id, target: c.id,
        type: 'verb-link', strength: 4,
        color: c.color,   // 与概念推断关系颜色一致
        verb: vn.verb, inf: c.inf,
      });
    });
  });
  return {verbNodes, verbLinks};
}

svg.call(zoom);

const H = () => svg.node().clientHeight;

let currentView = 'raw';

let sim = null;

function stopSim() { if (sim) { sim.stop(); sim = null; } }

// ── 视图构建 ──────────────────────────────────────

function buildRaw() {
  const conceptNodes = RAW_NODES.filter(d => d.type === 'concept');
  const {verbNodes, verbLinks} = buildVerbNodes(conceptNodes);
  const nodes = [...RAW_NODES.map(d => ({...d})), ...verbNodes];
  const links = [...RAW_LINKS.map(d => ({...d})), ...verbLinks];
  return {nodes, links};
}

function buildConnect() {
  const conceptNodes = RAW_NODES.filter(d => d.type === 'concept');
  const {verbNodes, verbLinks} = buildVerbNodes(conceptNodes);
  // concept nodes with new ids so we can map verb links to them
  const conceptCopies = conceptNodes.map(d => ({...d}));
  const links = [];
  conceptCopies.forEach(n => {
    links.push({
      source: n.id, target: '__center__',
      type: 'concept-link', strength: 3, color: n.color, verb: n.verb, inf: n.inf
    });
  });
  // remap verb links to same concept ids
  verbLinks.forEach(l => links.push({...l}));
  const nodes = [
    RAW_NODES.find(d => d.type === 'center'),
    ...conceptCopies,
    ...verbNodes,
  ].map(d => ({...d}));
  return {nodes, links};
}

function buildMergeObj() {
  const concepts = RAW_NODES.filter(d => d.type === 'concept');
  const byLabel = {};
  concepts.forEach(c => {
    if (!byLabel[c.label]) byLabel[c.label] = [];
    byLabel[c.label].push(c);
  });
  const mergedConcepts = Object.values(byLabel).map(arr => {
    const base = arr[0];
    const docSet = [...new Set(arr.map(x => x.doc))];
    return {
      ...base,
      id: '__m__' + base.label,
      r: Math.min(22, 8 + docSet.length * 3),
      _docs: docSet, _count: arr.length,
      _allInf: [...new Set(arr.map(x => x.inf))],
      _allVerb: [...new Set(arr.map(x => x.verb).filter(Boolean))],
    };
  });
  const nodes = [RAW_NODES.find(d => d.type==='center'), ...mergedConcepts].map(d => ({...d}));
  const links = mergedConcepts.map(n => ({
    source: n.id, target: '__center__',
    type: 'concept-link', strength: 3, color: n.color, verb: n.verb, inf: n.inf
  }));
  return {nodes, links};
}

function buildMergeInf() {
  const INF_LIST = Object.keys(INF_COLORS);
  const concepts = RAW_NODES.filter(d => d.type === 'concept');
  const groups = {};
  concepts.forEach(c => { if (!groups[c.inf]) groups[c.inf]=[]; groups[c.inf].push(c); });
  const groupNodes = INF_LIST.filter(inf => groups[inf]).map(inf => ({
    id: '__g__' + inf, label: inf, type: 'group',
    color: INF_COLORS[inf]||'#888',
    r: Math.min(40, 14 + (groups[inf]?.length||0) * 0.3),
    inf, doc:'', basis:'', verb:'',
    _count: groups[inf]?.length || 0, _members: groups[inf]||[],
  }));
  const memberNodes=[], memberLinks=[];
  groupNodes.forEach(g => {
    g._members.forEach(c => {
      const mn = {...c, id:'__gm__'+g.inf+'_'+c.label};
      memberNodes.push(mn);
      memberLinks.push({source:mn.id,target:g.id,type:'member-link',strength:4,color:g.color,verb:c.verb,inf:c.inf});
    });
  });
  const nodes = [RAW_NODES.find(d=>d.type==='center'), ...groupNodes, ...memberNodes].map(d=>({...d}));
  const links = [
    ...groupNodes.map(g => ({source:'__center__',target:g.id,type:'group-link',strength:2,color:g.color,verb:'',inf:g.inf})),
    ...memberLinks,
  ];
  return {nodes, links};
}

function buildMergeVerb() {
  const concepts = RAW_NODES.filter(d => d.type==='concept' && d.verb);
  const groups = {};
  concepts.forEach(c => { if (!groups[c.verb]) groups[c.verb]=[]; groups[c.verb].push(c); });
  const topVerbs = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length).slice(0,25);
  const groupNodes = topVerbs.map(verb => {
    const infCount = {};
    groups[verb].forEach(c => infCount[c.inf]=(infCount[c.inf]||0)+1);
    const topInf = Object.keys(infCount).sort((a,b)=>infCount[b]-infCount[a])[0];
    return {
      id:'__v__'+verb, label:verb, type:'group',
      color: INF_COLORS[topInf]||'#8899aa',
      r: Math.min(36, 12 + groups[verb].length * 0.7),
      inf:topInf, doc:'', basis:'', verb,
      _count: groups[verb].length, _members: groups[verb],
    };
  });
  const memberNodes=[], memberLinks=[];
  groupNodes.forEach(g => {
    g._members.forEach(c => {
      const mn = {...c, id:'__vm__'+g.verb+'_'+c.label};
      memberNodes.push(mn);
      memberLinks.push({source:mn.id,target:g.id,type:'member-link',strength:4,color:g.color,verb:c.verb,inf:c.inf});
    });
  });
  const nodes = [RAW_NODES.find(d=>d.type==='center'), ...groupNodes, ...memberNodes].map(d=>({...d}));
  const links = [
    ...groupNodes.map(g=>({source:'__center__',target:g.id,type:'group-link',strength:2,color:g.color,verb:g.verb,inf:g.inf})),
    ...memberLinks,
  ];
  return {nodes, links};
}

// ── 渲染主函数 ────────────────────────────────────
function render(view) {
  stopSim();
  gRoot.selectAll('*').remove();

  let {nodes, links} = (
    view==='raw'        ? buildRaw()       :
    view==='connect'    ? buildConnect()   :
    view==='merge-obj'  ? buildMergeObj()  :
    view==='merge-inf'  ? buildMergeInf()  :
    view==='merge-verb' ? buildMergeVerb() :
    buildRaw()
  );

  // 固定中心节点
  nodes.forEach(d => { if (d.type==='center') { d.fx=0; d.fy=0; } });

  gLinks = gRoot.append('g').attr('class','links');
  gNodes = gRoot.append('g').attr('class','nodes');

  // ── 连线 ─────────────────────────────────────────
  const linkSel = gLinks.selectAll('line').data(links).join('line')
    .attr('stroke', d => d.color || '#334')
    .attr('stroke-width', d =>
      d.type==='doc-link'    ? 2   :
      d.type==='group-link'  ? 2.5 :
      d.type==='member-link' ? 0.8 :
      d.type==='verb-link'   ? 1   :
      Math.max(0.5, (d.strength||2)*0.35))
    .attr('stroke-opacity', d =>
      d.type==='doc-link'    ? 0.5  :
      d.type==='group-link'  ? 0.6  :
      d.type==='member-link' ? 0.22 :
      d.type==='verb-link'   ? 0.5  :
      0.38)
    .attr('stroke-dasharray', d =>
      d.type==='verb-link'   ? '4,3' :
      d.type==='member-link' ? '2,2' :
      (d.strength||5) < 2   ? '4,3' : null);

  // ── 节点 ─────────────────────────────────────────
  const nodeSel = gNodes.selectAll('g.node').data(nodes, d => d.id).join('g')
    .attr('class', d => 'node node-' + d.type)
    .call(d3.drag()
      .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e,d) => { if(!e.active) sim.alphaTarget(0); if(d.type!=='center'){d.fx=null;d.fy=null;} }));

  // 中心光晕
  nodeSel.filter(d => d.type==='center').append('circle')
    .attr('r', d => d.r+16).attr('fill','none')
    .attr('stroke','#c0392b').attr('stroke-width',1.5).attr('stroke-opacity',0.18);

  // 主圆
  nodeSel.append('circle')
    .attr('r', d => {
      if (d.type==='concept') return conceptRadius(d.label);
      return d.r;
    })
    .attr('fill', d => d.color)
    .attr('fill-opacity', d =>
      d.type==='verb'    ? 0.55 :
      d.type==='concept' ? 0.80 :
      d.type==='group'   ? 0.80 : 0.88)
    .attr('stroke', d =>
      d.type==='center'  ? '#e74c3c' :
      d.type==='doc'     ? '#9aa0a8' :
      d.type==='verb'    ? '#9ac4da' : 'none')
    .attr('stroke-width', d =>
      d.type==='center' ? 3 :
      d.type==='doc'    ? 1.5 :
      d.type==='verb'   ? 1 : 0)
    .attr('stroke-opacity', 0.7);

  // 标签
  nodeSel.append('text')
    .attr('text-anchor','middle').attr('dominant-baseline','central')
    .attr('fill','#fff').attr('pointer-events','none')
    .each(function(d) {
      const el = d3.select(this);
      const isCenter = d.type==='center';
      const isDoc    = d.type==='doc';
      const isVerb   = d.type==='verb';
      const isGroup  = d.type==='group';

      // 中心和文件节点按\n手动换行，概念节点完整显示最多两行
      let lines;
      if (isCenter || isDoc) {
        lines = d.label.split('\n');
      } else if (isVerb) {
        lines = [d.label];
      } else if (isGroup) {
        lines = [d.label];
      } else {
        // concept：完整显示，超过5字换行
        lines = wrapText(d.label, 5);
      }

      const fs = isCenter ? 15 : isDoc ? 11 : isVerb ? 10 : isGroup ? 12 : 11;
      el.attr('font-size', fs)
        .attr('font-weight', isCenter||isGroup ? '700' : isVerb ? '600' : '400');

      const lineH = fs + 2.5;
      const startDy = -((lines.length - 1) / 2) * lineH;
      lines.forEach((ln, i) => {
        el.append('tspan')
          .attr('x', 0)
          .attr('dy', i===0 ? startDy : lineH)
          .text(ln);
      });
    });

  // ── Tooltip ──────────────────────────────────────
  const tt = document.getElementById('tooltip');
  nodeSel.on('mousemove', (e,d) => {
    if (d.type==='center') return;
    let html = `<div class="tt-label">${d.label}</div>`;
    if (d.type==='doc') {
      const cnt = RAW_NODES.filter(n=>n.doc===d.doc&&n.type==='concept').length;
      html += `<div class="tt-row">文件：<span>${d.doc}</span></div>`;
      html += `<div class="tt-row">概念节点数：<span>${cnt}</span></div>`;
    } else if (d.type==='verb') {
      html += `<div class="tt-row">类型：<span>谓词</span></div>`;
      html += `<div class="tt-row">关联概念数：<span>${d._count}</span></div>`;
      const sample = d._members.slice(0,4).map(m=>m.label).join('、');
      html += `<div class="tt-basis">关联对象：${sample}${d._count>4?'…':''}</div>`;
    } else if (d.type==='group') {
      html += `<div class="tt-row">分组依据：<span>${d.inf||d.verb||''}</span></div>`;
      html += `<div class="tt-row">包含概念数：<span>${d._count}</span></div>`;
    } else {
      if (d.verb) html += `<div class="tt-verb">谓词：${d.verb}</div>`;
      html += `<div class="tt-row">推断关系：<span>${d.inf}</span></div>`;
      html += `<div class="tt-row">文本关系：<span>${d.rel||''}</span></div>`;
      if (d.doc) html += `<div class="tt-row">来源：<span>${d.doc.slice(0,18)}…</span></div>`;
      if (d.basis) html += `<div class="tt-basis">${d.basis.slice(0,140)}${d.basis.length>140?'…':''}</div>`;
    }
    tt.innerHTML = html;
    tt.style.display = 'block';
    const tx = Math.min(e.clientX+14, window.innerWidth-tt.offsetWidth-10);
    const ty = Math.min(e.clientY-10,  window.innerHeight-tt.offsetHeight-16);
    tt.style.left = tx+'px'; tt.style.top = ty+'px';
  }).on('mouseleave', () => { tt.style.display='none'; });

  // ── 力导向仿真 ────────────────────────────────────
  const isFlat = (view==='connect'||view==='merge-obj');
  const hasVerbs = (view==='raw'||view==='connect');

  sim = d3.forceSimulation(nodes)
    .alphaDecay(0.03)
    .force('link', d3.forceLink(links).id(d=>d.id)
      .distance(d => {
        if (d.type==='doc-link'||d.type==='group-link') return isFlat ? 360 : 300;
        if (d.type==='member-link') return 150;
        if (d.type==='verb-link')   return 110;
        const s = d.strength||2;
        return 360 - s*26;
      })
      .strength(d =>
        d.type==='doc-link'||d.type==='group-link' ? 0.45 :
        d.type==='member-link' ? 0.5 :
        d.type==='verb-link'   ? 0.4 :
        0.28))
    .force('charge', d3.forceManyBody().strength(d =>
      d.type==='center'  ? -2400 :
      d.type==='doc'     ? -900  :
      d.type==='group'   ? -1000 :
      d.type==='verb'    ? -250  :
      // concept: repulsion scales with bubble size
      -(conceptRadius(d.label) * 20)))
    .force('collide', d3.forceCollide(d => {
      if (d.type==='concept') return conceptRadius(d.label) + 18;
      if (d.type==='verb')    return d.r + 12;
      return d.r + 10;
    }).strength(0.92).iterations(4))
    .force('x', d3.forceX(0).strength(0.015))
    .force('y', d3.forceY(0).strength(0.015))
    .on('end', autoFit)
    .on('tick', () => {
      linkSel
        .attr('x1', d=>d.source.x).attr('y1', d=>d.source.y)
        .attr('x2', d=>d.target.x).attr('y2', d=>d.target.y);
      nodeSel.attr('transform', d=>`translate(${d.x},${d.y})`);
    });
}

// ── 自动适应视口 ────────────────────────────────────
function autoFit() {
  if (!gNodes) return;
  let xMin=Infinity, xMax=-Infinity, yMin=Infinity, yMax=-Infinity;
  gNodes.selectAll('g.node').each(function(d) {
    const r = (d.type==='concept' ? conceptRadius(d.label) : (d.r||20)) + 18;
    if (isFinite(d.x)) { xMin=Math.min(xMin,d.x-r); xMax=Math.max(xMax,d.x+r); }
    if (isFinite(d.y)) { yMin=Math.min(yMin,d.y-r); yMax=Math.max(yMax,d.y+r); }
  });
  if (!isFinite(xMin)) return;
  const pad = 24;
  const sc = Math.min(
    W() / (xMax - xMin + pad*2),
    H() / (yMax - yMin + pad*2)
  );
  const tx = W()/2 - sc * (xMin + xMax)/2;
  const ty = H()/2 - sc * (yMin + yMax)/2;
  svg.transition().duration(700)
     .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
}

// ── 筛选 ──────────────────────────────────────────
function applyFilters() {
  if (!gNodes || !gLinks) return;
  gNodes.selectAll('g.node').each(function(d) {
    let show = true;
    if (d.type==='concept') {
      if (activeInf!=='all' && d.inf!==activeInf) show=false;
      if (activeDoc!=='all' && d.doc!==activeDoc) show=false;
    } else if (d.type==='doc') {
      if (activeDoc!=='all' && d.doc!==activeDoc) show=false;
    } else if (d.type==='verb') {
      // 谓词节点：若所有关联概念都被筛掉，则也淡化
      if (activeInf!=='all' || activeDoc!=='all') {
        const visibleMem = (d._members||[]).filter(m =>
          (activeInf==='all'||m.inf===activeInf) &&
          (activeDoc==='all'||m.doc===activeDoc));
        if (visibleMem.length===0) show=false;
      }
    }
    d3.select(this).attr('opacity', show ? 1 : 0.05);
  });
  gLinks.selectAll('line').each(function(d) {
    const src = d.source, tgt = d.target;
    let show = true;
    if (d.type==='concept-link') {
      if (activeInf!=='all' && src.inf!==activeInf) show=false;
      if (activeDoc!=='all' && src.doc!==activeDoc) show=false;
    } else if (d.type==='doc-link') {
      if (activeDoc!=='all' && tgt.doc!==activeDoc) show=false;
    } else if (d.type==='verb-link') {
      if (activeInf!=='all' && tgt.inf!==activeInf) show=false;
      if (activeDoc!=='all' && tgt.doc!==activeDoc) show=false;
    }
    d3.select(this).attr('opacity', show ? 1 : 0.02);
  });
}

// ── 事件 ──────────────────────────────────────────
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    const names = {raw:'原始视图',connect:'对象直连','merge-obj':'按对象合并','merge-inf':'按推断关系合并','merge-verb':'按谓词合并'};
    document.getElementById('subtitle').textContent =
      `2024—2026 · 5份文件 · 108 个概念节点 · ${names[currentView]}`;
    render(currentView);
    svg.call(zoom.transform, d3.zoomIdentity.translate(W()/2, H()/2).scale(0.45));
    if (window._fitTimer) clearTimeout(window._fitTimer);
    window._fitTimer = setTimeout(autoFit, 3200);
  });
});

document.querySelectorAll('.filter-btn[data-inf]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-inf]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeInf = btn.dataset.inf;
    applyFilters();
  });
});

document.querySelectorAll('.filter-btn[data-doc]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-doc]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeDoc = btn.dataset.doc;
    applyFilters();
  });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  activeInf='all'; activeDoc='all';
  document.querySelectorAll('.filter-btn[data-inf]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-inf="all"]').classList.add('active');
  document.querySelectorAll('.filter-btn[data-doc]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-doc="all"]').classList.add('active');
  applyFilters();
  autoFit();
});

// ── 初始化 ────────────────────────────────────────
render('raw');
svg.call(zoom.transform, d3.zoomIdentity.translate(W()/2, H()/2).scale(0.45));
if (window._fitTimer) clearTimeout(window._fitTimer);
window._fitTimer = setTimeout(autoFit, 3200);
</script>
